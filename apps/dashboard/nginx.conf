# Dashboard (T12) servido pelo nginx; /api, /metrics e /health vão para o serviço api na rede do compose (T16).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolver do Docker: resolve "api" a cada requisição (o container da api pode ser recriado).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location ~ ^/(api|metrics|health)(/|$) {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # SPA: rotas do cliente caem no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
